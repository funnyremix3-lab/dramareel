name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reeldrama
          POSTGRES_PASSWORD: reeldrama
          POSTGRES_DB: reeldrama_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reeldrama" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgresql://reeldrama:reeldrama@localhost:5432/reeldrama_test
      TEST_REDIS_URL: redis://localhost:6379
      TEST_S3_ENDPOINT: http://localhost:9000
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - name: Start S3-compatible storage (SeaweedFS)
        working-directory: infra/docker
        run: |
          docker run -d --name s3 -p 9000:8333 -v "$PWD/s3.json:/etc/seaweedfs/s3.json:ro" chrislusf/seaweedfs:4.48 \
            server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data -volume.max=0 -master.volumeSizeLimitMB=256
          for i in $(seq 1 30); do curl -s -o /dev/null localhost:9000 && break; sleep 2; done
      - run: npm ci
      - run: npx prisma validate
        env: { DATABASE_URL: postgresql://x@localhost/x, DIRECT_DATABASE_URL: postgresql://x@localhost/x }
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  workers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [workers/video-transcoder, workers/notifications, tools/drama-importer]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: '${{ matrix.dir }}/package-lock.json' }
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx jest

  media-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare/media-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: infra/cloudflare/media-worker/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest --ci
      - run: npx expo export --platform android --output-dir /tmp/export

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      # hashFiles() is not allowed in job-level `if`; gate each step instead.
      - if: hashFiles('apps/admin/package.json') != ''
        uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: apps/admin/package-lock.json }
      - if: hashFiles('apps/admin/package.json') != ''
        run: npm ci
      - if: hashFiles('apps/admin/package.json') != ''
        run: npm run typecheck
      - if: hashFiles('apps/admin/package.json') != ''
        run: npm run lint
      - if: hashFiles('apps/admin/package.json') != ''
        run: npm test
      - if: hashFiles('apps/admin/package.json') != ''
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [api, workers]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t reel-drama-api .
      - run: docker build -f workers/video-transcoder/Dockerfile -t reel-drama-transcoder .
      - run: docker build -f workers/notifications/Dockerfile -t reel-drama-notifications .
