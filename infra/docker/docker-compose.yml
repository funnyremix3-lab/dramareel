# Local development services. NOT a production setup (no TLS, default credentials).
#   docker compose -f infra/docker/docker-compose.yml up -d
name: reel-drama

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reeldrama
      POSTGRES_PASSWORD: reeldrama
      POSTGRES_DB: reeldrama
    ports: ["54329:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reeldrama"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["63799:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # S3-compatible object storage for local dev (production uses Cloudflare R2).
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data -volume.max=0 -master.volumeSizeLimitMB=256
    ports: ["9000:8333"]
    volumes: [s3data:/data, ./s3.json:/etc/seaweedfs/s3.json:ro]

volumes:
  pgdata:
  s3data:
